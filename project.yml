name: NotchFull
options:
  bundleIdPrefix: com.victornovais
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NotchFull:
    type: application
    platform: macOS
    sources:
      - NotchFull
    info:
      path: NotchFull/Info.plist
      properties:
        CFBundleDisplayName: NotchFull
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Agent app: no Dock icon and no main menu; the notch is the UI.
        LSUIElement: true
        NSCalendarsFullAccessUsageDescription: NotchFull shows your upcoming events in the notch.
        NSAppleEventsUsageDescription: NotchFull reads the current track and controls playback in Spotify and Music.
        NSBluetoothAlwaysUsageDescription: NotchFull shows your Bluetooth devices and their battery when they connect.
        NSAudioCaptureUsageDescription: NotchFull listens to your music player's audio to animate the visualizer. Nothing is recorded or stored.
    entitlements:
      path: NotchFull/NotchFull.entitlements
      properties:
        # Hardened runtime blocks these resources unless the entitlement is present.
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victornovais.NotchFull
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # A stable development identity keeps privacy permissions (Bluetooth, Calendar, Automation) across
        # local rebuilds; ad-hoc signatures change every build and macOS asks again each time. The entitlements
        # used do not need a provisioning profile, so manual signing works with the free Personal Team.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: victornovaislima@gmail.com (8W897BLPJ5)"
          DEVELOPMENT_TEAM: KDX44D889T
        # CI release builds are ad-hoc until a Developer ID certificate and notarization are set up.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
